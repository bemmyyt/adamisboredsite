/* TRACKSIDE visual language: screenprinted motorsport / hand-built indie game */
:root{--lime:#ffb347;--ink:#111a20;--paper:#f4eedf}
html,body{font-family:Verdana,Arial,sans-serif;background:#17232a}
#grain{opacity:.11}
.topline{height:7px;background:repeating-linear-gradient(90deg,#ffb347 0 54px,#23343a 54px 66px)}
#overlay{background:linear-gradient(90deg,rgba(17,25,29,.98) 0%,rgba(17,25,29,.94) 38%,rgba(17,25,29,.28) 100%)}
#menu{position:relative;border-left:5px solid #ffb347;padding-left:30px;max-width:690px}
.eyebrow{font:800 12px/1.6 'Courier New',monospace;letter-spacing:.16em;color:#ffb347}
h1{font-family:Impact,'Arial Black',sans-serif;font-style:italic;font-size:clamp(68px,10.5vw,160px);letter-spacing:-.065em;text-shadow:5px 7px 0 #080e11;margin:15px 0 30px}
h1 span{color:#ffb347}
.tagline{font:700 17px/1.65 'Courier New',monospace;letter-spacing:-.04em;color:#d7d9ce;max-width:520px}
.action{font:900 23px Impact,'Arial Black',sans-serif;letter-spacing:.05em;background:#ffb347;box-shadow:7px 7px 0 #654d35;border:2px solid #f7d6a2;border-radius:0}
.action:hover{background:#ffe1ad}
.subAction{font:800 14px 'Courier New',monospace;border:2px solid #6b7d7b}
.menuFooter{border-top:1px solid #56625e;padding-top:20px;font:700 11px 'Courier New',monospace;letter-spacing:.02em}
.menuFooter strong{font:900 28px Impact,sans-serif;color:#ffb347;margin-bottom:4px}
.brand{font:italic 900 24px Impact,sans-serif;letter-spacing:.035em;text-shadow:2px 3px 0 #101a20}
.brand b{color:#f4eedf}.brand span{color:#ffb347!important}
.meta{font:700 11px 'Courier New',monospace;letter-spacing:.07em;color:#e1e5d9}
.time{font:900 46px Impact,sans-serif;letter-spacing:.04em;color:#ffefc9;text-shadow:3px 3px 0 #172129}
.speedNumber{font:italic 900 48px Impact,sans-serif;color:#ffefc9}
.speedTrack{height:9px;border:2px solid #89938b;background:#24343a;transform:none}
#speedFill{background:#ffb347;box-shadow:none}
.controls{font:700 12px 'Courier New',monospace;letter-spacing:0;color:#f1e7d3}
.key{border:2px solid #bdc5b4;background:#283a40}
.courseBadge{border-color:#ffb347;font:700 13px 'Courier New',monospace}
.courseBadge strong{font:900 78px Impact,sans-serif}
.pauseTitle{font:italic 900 95px Impact,sans-serif}
.accent{color:#ffb347}
#toast{font:italic 900 32px Impact,sans-serif;color:#ffb347}
@media(max-width:700px){#menu{padding-left:15px}h1{font-size:clamp(56px,14vw,92px)}.tagline{font-size:13px}.menuFooter{gap:12px;flex-wrap:wrap}.action{font-size:19px}.brand{font-size:18px}}

/* Edition 02: old-school track poster, not a dashboard */
#overlay:before{content:' ';position:absolute;right:8%;top:17%;width:min(32vw,430px);height:min(54vh,440px);border:14px solid #f0dfb9;outline:5px solid #111d22;transform:rotate(-9deg);opacity:.16;pointer-events:none;background:repeating-linear-gradient(145deg,transparent 0 36px,#ffb347 36px 46px,transparent 46px 70px)}
#overlay:after{content:'RUN / FALL / RETRY';position:absolute;right:7%;bottom:12%;font:italic 900 clamp(24px,4vw,62px) Impact,'Arial Black',sans-serif;letter-spacing:.02em;color:#ffb347;transform:rotate(-8deg);opacity:.36;pointer-events:none}
#menu{z-index:2}#hudTop{background:linear-gradient(#14232999,transparent);padding:10px 0}.speedBox{background:#142329aa;padding:12px;border-left:4px solid #ffb347}.action:active{transform:skewX(-10deg) translateY(4px);box-shadow:3px 3px 0 #654d35}
@media(max-width:850px){#overlay:before,#overlay:after{display:none}}

/* 0.3: physical, printed signage rather than floating dashboard cards */
#overlay{background:linear-gradient(92deg,#162228fa 0%,#162228ef 46%,#16222855 100%)}
#menu{border-left:8px solid #ffb347;padding-left:32px}
#menu h1{letter-spacing:-.07em;text-transform:uppercase}
.action{transition:transform .12s,background .12s}
.action:focus-visible,.subAction:focus-visible{outline:3px solid white;outline-offset:5px}
#hudTop .hudRight{border-right:3px solid #ffb347;padding-right:12px}
@media(max-width:700px){#menu{padding-left:17px}}

#menu{max-width:min(1040px,92vw)}
.trackGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-height:49vh;overflow:auto;margin:14px 0 20px;padding:4px}
.trackTile{min-height:99px;background:#223139;color:#f4ead5;border:2px solid #57645e;text-align:left;padding:12px;cursor:pointer;font-family:'Courier New',monospace;transition:background .12s,transform .12s}
.trackTile:hover,.trackTile:focus-visible{background:#4d493c;border-color:#ffb347;transform:translateY(-2px);outline:none}
.trackTile small{display:block;color:#e6ac69;font-size:10px;margin-bottom:8px}
.trackTile strong{display:block;font:bold 19px Impact,'Arial Black',sans-serif;letter-spacing:.015em}
.trackTile span{display:block;color:#c1c6bb;font-size:10px;margin-top:8px}
@media(max-width:650px){.trackGrid{grid-template-columns:repeat(2,minmax(0,1fr));max-height:53vh}.trackTile strong{font-size:15px}.pauseTitle{font-size:55px}}

#splitToast{position:absolute;top:25%;left:50%;transform:translate(-50%,-12px);font:800 23px 'Courier New',monospace;background:#18272be8;padding:12px 19px;border-left:4px solid #e3aa6c;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;white-space:nowrap;z-index:5}
#splitToast.show{opacity:1;transform:translate(-50%,0)}

/* MOMENTUM 0.6 / Printed race-program interface.
   Warm paper, track orange, asphalt, no glass cards or floating dashboards. */
:root{--orange:#e87538;--cream:#f1e7d4;--coal:#1a2729;--line:#c5bca9}
#overlay{background:#e8dfcd;display:block;padding:0;overflow:auto;color:var(--coal)}
#overlay::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background:repeating-linear-gradient(0deg,transparent 0 3px,#564b3a16 3px 4px);z-index:3}
#menu{border:0;padding:0;max-width:none;min-height:100vh;width:100%}
#overlay .courseBadge{display:none}
.screen{min-height:100vh;display:flex;flex-direction:column}
.screen-top,.screen-bottom{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px clamp(20px,4vw,65px);font:700 11px/1.3 'Courier New',monospace;letter-spacing:.08em}
.screen-top{border-bottom:2px solid #1a2729;min-height:66px}

.edition b{color:#be592b}
.screen-content{flex:1;display:flex;min-height:0}
.hero-layout{display:grid;grid-template-columns:53% 47%;width:100%;min-height:calc(100vh - 115px)}
.hero-main{padding:clamp(32px,6vh,85px) clamp(25px,6vw,95px) 30px;position:relative;overflow:hidden}
.sticker{display:inline-block;background:#1a2729;color:#e8dfcd;font:700 10px 'Courier New',monospace;letter-spacing:.13em;padding:10px 12px;transform:rotate(-2deg);margin-bottom:32px}
.micro{font:800 11px/1.6 'Courier New',monospace;letter-spacing:.17em;color:#a24d2b;text-transform:uppercase;margin:0 0 13px}
.hero-main h1{font:900 clamp(95px,11vw,205px)/.72 Impact,'Arial Black',sans-serif;letter-spacing:-.07em;font-style:normal;text-shadow:none;color:#1a2729;margin:20px 0 30px}
.hero-main h1 i{font-style:normal;margin-left:clamp(12px,2vw,35px)}
.hero-main h1 span{color:var(--orange)}
.hero-copy{font:700 clamp(14px,1.45vw,20px)/1.65 'Courier New',monospace;letter-spacing:-.04em;max-width:500px;margin:30px 0}

.primary-button{border:0;background:var(--orange);color:#1a2729;cursor:pointer;font:900 18px Impact,'Arial Black',sans-serif;letter-spacing:.07em;padding:19px 24px;display:inline-flex;gap:34px;justify-content:space-between;align-items:center;box-shadow:5px 5px 0 #1a2729;transition:transform .12s,box-shadow .12s}
.primary-button:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 #1a2729;background:#f18b4b}

.quiet-button{font:800 12px 'Courier New',monospace;color:var(--coal);border:0;border-bottom:2px solid currentColor;padding:12px 3px;background:none;cursor:pointer;letter-spacing:.03em}
.quiet-button:hover{color:#b65128}
.hero-meta{display:flex;gap:clamp(20px,3vw,60px);border-top:2px solid #1a2729;padding-top:17px;margin-top:clamp(25px,6vh,90px);font:700 11px 'Courier New',monospace;letter-spacing:.05em}
.hero-meta b{font:900 28px Impact,sans-serif;display:block;margin-bottom:4px}
.hero-art{position:relative;overflow:hidden;background:#b75c38;border-left:2px solid #1a2729;min-height:530px}
.hero-art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 85px,#1a27291c 85px 88px);z-index:1}
.art-number{position:absolute;font:900 clamp(220px,35vw,650px)/1 Impact,sans-serif;color:#dc8a58;right:-8%;top:-13%;letter-spacing:-.1em}
.art-sun{position:absolute;top:18%;right:21%;width:27%;aspect-ratio:1;border:8px solid #e8c795;border-radius:50%;box-shadow:0 0 0 18px #e8c79535}
.art-track{position:absolute;height:24%;background:#1b2a2b;transform:rotate(-24deg);width:145%;left:-15%;box-shadow:0 15px 0 #e9bd83}
.art-track-one{bottom:13%}.art-track-two{bottom:-24%;transform:rotate(16deg)}
.art-runner{position:absolute;left:45%;top:38%;height:160px;width:100px;transform:rotate(15deg);filter:drop-shadow(14px 15px 0 #1b2a2b35);z-index:2}
.runner-head{position:absolute;left:37px;top:0;width:52px;height:46px;background:#f2d0a0;border:10px solid #1b2a2b;border-radius:50% 50% 20% 20%}
.runner-body{position:absolute;left:19px;top:52px;width:64px;height:64px;background:#e9bd83;border:12px solid #1b2a2b;transform:skew(-13deg)}
.runner-leg{position:absolute;top:105px;width:18px;height:85px;background:#1b2a2b;transform-origin:top}
.leg-a{left:34px;transform:rotate(36deg)}.leg-b{left:66px;transform:rotate(-48deg)}
.art-caption{position:absolute;bottom:30px;right:30px;text-align:right;color:#f6dfb9;font:700 12px/1.8 'Courier New',monospace;z-index:2}
.directory,.settings-layout,.result-layout{width:100%;padding:clamp(24px,4vw,60px) clamp(20px,6vw,100px);max-width:1500px;margin:auto}
.directory-heading{display:flex;align-items:end;justify-content:space-between;gap:20px}
.directory h2,.settings-layout h2,.result-layout h2{font:900 clamp(57px,8vw,125px)/.9 Impact,'Arial Black',sans-serif;letter-spacing:-.04em;color:var(--coal);margin:0 0 27px;font-style:normal}
.directory h2 em,.settings-layout h2 em,.result-layout h2 em{font-style:normal;color:var(--orange)}
.filter-strip{display:flex;gap:0;overflow:auto;border-bottom:3px solid var(--coal);margin:10px 0 0}
.filter{border:0;background:transparent;color:#635d51;padding:15px 23px;font:800 12px 'Courier New',monospace;white-space:nowrap;cursor:pointer}
.filter.selected{background:var(--coal);color:var(--cream)}.filter:hover:not(.selected){background:#d6cbbb}
.race-list{max-height:48vh;overflow:auto;border-bottom:2px solid var(--coal)}
.race-row{display:grid;grid-template-columns:75px minmax(0,1fr) 150px 32px;align-items:center;gap:16px;width:100%;padding:15px 17px;border:0;border-bottom:1px solid #b4ab9c;background:transparent;text-align:left;color:var(--coal);cursor:pointer;transition:background .12s}
.race-row:hover,.race-row:focus-visible{background:#d3c4ad;outline:none}
.race-index{font:900 33px Impact,sans-serif;color:var(--orange)}
.race-name{font:900 27px Impact,'Arial Black',sans-serif;letter-spacing:.01em}
.race-name small,.race-record small{display:block;font:700 10px 'Courier New',monospace;color:#786e5f;letter-spacing:.06em;margin-top:5px}
.race-record{text-align:right;font:900 16px 'Courier New',monospace}
.race-arrow{font:900 26px Impact,sans-serif;color:var(--orange)}
.directory-note{display:flex;justify-content:space-between;gap:15px;padding:17px 0;font:800 11px 'Courier New',monospace}
.settings-layout{max-width:900px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:25px;border-top:2px solid var(--coal);padding:20px 0}
.setting-row strong,.control-sheet>strong{font:900 23px Impact,sans-serif;display:block}
.setting-row small{display:block;margin-top:6px;font:12px 'Courier New',monospace}
.setting-toggle{padding:12px 24px;background:var(--coal);color:var(--cream);border:0;font:900 16px Impact,sans-serif;cursor:pointer}
.danger{color:#a33d2c}
.control-sheet{border-top:2px solid var(--coal);padding:22px 0;margin-bottom:25px}
.control-sheet>div{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #c0b5a4;padding:9px 0;font:700 12px 'Courier New',monospace}
.result-layout{max-width:1050px;position:relative}
.result-stamp{position:absolute;right:7%;top:12%;border:5px double #bb6037;padding:12px 22px;transform:rotate(10deg);color:#bb6037;font:900 35px Impact,sans-serif}
.pause-timer,.finish-time{font:900 clamp(55px,9vw,140px)/1 Impact,sans-serif;letter-spacing:-.04em;margin:30px 0;color:var(--coal)}
.pause-timer small,.finish-time small{display:block;font:800 12px 'Courier New',monospace;letter-spacing:.12em;color:#a24d2b;margin-top:15px}
.result-stats{display:flex;gap:clamp(20px,5vw,80px);border-top:2px solid var(--coal);border-bottom:2px solid var(--coal);padding:20px 0;margin:30px 0}
.result-stats span{display:block;font:800 11px 'Courier New',monospace;margin-bottom:10px}
.result-stats b{font:900 28px Impact,sans-serif}
.result-actions{display:flex;gap:25px;align-items:center;flex-wrap:wrap}
#overlay button:focus-visible{outline:3px solid #1b2a2b;outline-offset:4px}
@media(max-width:850px){.hero-layout{grid-template-columns:1fr}.hero-art{display:none}.hero-main{padding:55px 7vw}.hero-main h1{font-size:clamp(85px,18vw,160px)}.edition{display:none}.hero-meta{margin-top:50px}}

.primary-button{font:600 15px Arial,sans-serif;letter-spacing:0;background:#273a33;color:#f8f4eb;border-radius:5px;padding:14px 22px;min-width:124px;box-shadow:none}

function draw(){const g=ctx;g.clearRect(0,0,W,H);const sky=g.createLinearGradient(0,0,0,H);const zone=courses[level].zone||'FOUNDATION';
sky.addColorStop(0,zone==='RED ZONE'?'#46343d':zone==='HEIGHTS'?'#283e51':'#30434a');
sky.addColorStop(1,zone==='RED ZONE'?'#241e2b':zone==='HEIGHTS'?'#172630':'#131e23');g.fillStyle=sky;g.fillRect(0,0,W,H);
 // Printed-paper sky, distant sun and a staggered factory skyline.
 const sy=H*.66;
 g.save();g.globalAlpha=.35;g.fillStyle='#c48d5c';g.beginPath();g.arc(W*.79,H*.24,Math.min(W,H)*.13,0,Math.PI*2);g.fill();g.restore();
 g.save();g.translate(-camera*.065,0);
 for(let i=-2;i<22;i++){const x=i*270;const roof=sy-135-(Math.abs(i*47)%100);rect(x,roof,175,H,'#283d43');rect(x+36,roof-65,19,75,'#283d43');rect(x+130,roof-105,12,110,'#283d43');for(let j=0;j<5;j++)rect(x+18+j*30,roof+30,11,6,'#51636a');}
 g.restore();
 g.save();g.translate(-camera*.16,0);for(let i=-3;i<45;i++){let x=i*210;rect(x,sy-105-(i%4)*22,160,H,'#334750');rect(x+20,sy-93-(i%4)*22,7,70,'#465c62');rect(x+90,sy-93-(i%4)*22,7,70,'#465c62')}g.restore();
 g.save();g.translate(-camera*.35,0);for(let i=-2;i<30;i++){const x=i*380;rect(x,sy-230,7,320,'#51636a');rect(x-55,sy-230,115,8,'#51636a');rect(x-36,sy-209,78,36,'#263a42');rect(x-26,sy-197,56,4,'#efb56e')}g.restore();
 g.save();g.translate(-Math.round(camera)+(Math.random()-.5)*shake,Math.round((H-720)*.46)-camY+(Math.random()-.5)*shake);const c=courses[level];
 for(const b of c.platforms){
 const upper=b[3]<=22;
 if(upper){rect(...b,'#526e6d');rect(b[0],b[1],b[2],5,'#e6b77c');rect(b[0]+8,b[1]+9,b[2]-16,3,'#30484b');continue;}
 rect(...b,'#465b61');rect(b[0],b[1],b[2],9,'#e4d7b8');rect(b[0],b[1]+11,b[2],4,'#263941');
 for(let x=b[0]+16;x<b[0]+b[2]-12;x+=46){rect(x,b[1]+27,24,4,'#60767a');rect(x,b[1]+50,6,6,'#263941')}
 // Visible bolts and warning paint make the surfaces readable at speed.
 for(let x=b[0]+15;x<b[0]+b[2]-10;x+=92){rect(x,b[1]+3,4,3,'#766f61')}
 for(let x=b[0]+8;x<b[0]+b[2]-10;x+=32){rect(x,b[1]+b[3]-13,18,4,'#374b50')}
}
 for(const b of c.spikes){rect(...b,'#773c3c');for(let x=b[0];x<b[0]+b[2];x+=18){g.fillStyle='#ff7166';g.beginPath();g.moveTo(x,b[1]);g.lineTo(x+9,b[1]-18);g.lineTo(x+18,b[1]);g.fill()}}
 for(let i=0;i<c.shards.length;i++){if(shards.has(i))continue;const s=c.shards[i],r=11+Math.sin(frame*.08+i)*2;g.save();g.translate(s[0],s[1]);g.rotate(frame*.016);g.strokeStyle='#ffcb81';g.lineWidth=4;g.strokeRect(-r,-r,r*2,r*2);g.restore()}
 // Track-side kilometer boards, hanging cables and hand-painted warning markers.
 for(let i=0;i<c.platforms.length;i++){
 const b=c.platforms[i];if(b[3]<=22)continue;
 const x=b[0]+Math.min(80,b[2]*.3);
 if(i%2===0){rect(x,b[1]-77,5,77,'#a3a99b');rect(x-27,b[1]-90,61,27,'#e0bb83');g.fillStyle='#26343b';g.font='bold 14px monospace';g.fillText(''+String(i+1).padStart(2,'0')+' /',x-18,b[1]-71)}
 if(i%3===1){g.strokeStyle='#83918a';g.lineWidth=2;g.beginPath();g.moveTo(b[0]+30,b[1]+b[3]);g.bezierCurveTo(b[0]+50,b[1]+b[3]+34,b[0]+110,b[1]+b[3]+34,b[0]+140,b[1]+b[3]);g.stroke()}
 }
 
 // Exit is on the destination floor, not a vertical line spanning the map.
 rect(c.finish,c.finishY-118,7,118,'#ffb347');g.font='bold 21px system-ui,sans-serif';g.fillStyle='#ffdb9f';g.fillText('EXIT',c.finish-9,c.finishY-130);
 for(let i=0;i<c.checkpoints.length;i++){const cp=c.checkpoints[i];rect(cp.x,cp.y-52,3,52,i<=checkpointIndex?'#a5e4bd':'#89989a');rect(cp.x+3,cp.y-52,25,15,i<=checkpointIndex?'#a5e4bd':'#7b8b89')}
 
 // The courier: helmet, scarf, gloves and individually animated legs.
 const ph=player.h,py=player.y;
 g.save();g.translate(player.x+12,py+ph/2);
 const facing=player.vx>=0?1:-1;
 g.scale(facing,1);
 const lean=player.ground?Math.max(-.15,Math.min(.22,Math.abs(player.vx)*.012)):Math.max(-.22,Math.min(.22,player.vy*.014));
 g.rotate(lean);
 const stride=player.ground?Math.sin(animationTick*Math.max(.2,Math.abs(player.vx)*.15))*Math.min(5,Math.abs(player.vx)*.45):1;
 if(player.slide>.5){
   rect(-16,ph/2-15,33,12,'#e4d9bf');rect(7,ph/2-17,12,9,'#d88c52');rect(-13,ph/2-4,31,4,'#28363b');
 }else{
   // Scarf streams behind the player at high speed.
   g.fillStyle='#ed9856';g.beginPath();g.moveTo(-6,-ph/2+11);g.lineTo(-12-Math.abs(player.vx)*.8,-ph/2+10+Math.sin(frame*.25)*3);g.lineTo(-9,-ph/2+17);g.fill();
   rect(-8,-ph/2+12,17,17,'#e4d9bf');rect(8,-ph/2+15,5,10,'#e0aa73');
   rect(-7,ph/2-8,6,8+stride,'#263c42');rect(3,ph/2-8,6,8-stride,'#263c42');
   rect(-10,ph/2-2+stride,10,4,'#f5c17f');rect(2,ph/2-2-stride,10,4,'#f5c17f');
 }
 rect(-11,-ph/2,22,15,'#e3a15e');rect(-12,-ph/2+3,24,4,'#f4d7a4');rect(2,-ph/2+7,11,5,'#27383d');
 rect(-8,-ph/2-3,15,4,'#26383e');
 g.restore();
 // Brief speed streaks appear only when the player is actually fast.
 if(Math.abs(player.vx)>10&&frame%2===0){
 g.globalAlpha=.15+Math.abs(player.vx)/75;rect(player.x-Math.sign(player.vx)*24,player.y+ph*.45,18,2,'#ffe2b4');g.globalAlpha=1;
 }
 // Ghost is deliberately a translucent silhouette, never mistaken for the player.
 if(ghostVisible&&ghostRun&&state==='play'){
   const sample=ghostRun.frames[Math.min(ghostRun.frames.length-1,Math.floor(elapsed/16.667))];
   if(sample){g.save();g.globalAlpha=.48;rect(sample[0],sample[1],24,sample[2]||34,'#9ce8d7');rect(sample[0]+4,sample[1]+5,16,5,'#f7ebd1');g.restore()}
 }
 for(const t of particles){rect(t.x,t.y,3,3,t.color)}g.restore();
 // Subtle print-registration marks frame the playable view.
 g.fillStyle='#e7b77e';g.globalAlpha=.55;
 for(let i=0;i<5;i++){g.fillRect(W-31-i*13,H-23,8,3)}
 g.globalAlpha=1;rect(0,H-3,W,3,'#ffb347');
}
function loop(now){
 const delta=Math.min(48,Math.max(0,now-last));last=now;
 if(state==='play'){accumulator+=delta;let steps=0;while(accumulator>=16.667&&steps<4){update(1);accumulator-=16.667;steps++;}}
 else{accumulator=0;frame++;}
 for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life--}
 particles=particles.filter(p=>p.life>0);
 draw();requestAnimationFrame(loop)
}
addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(!keys[e.key]&&[' ','w','ArrowUp'].includes(e.key))player.buffer=9;keys[e.key]=true;if(e.key==='Escape'){if(state==='play')menuShow('pause');else if(state==='pause'){state='play';overlay.classList.add('hidden');hud.classList.remove('hidden');last=performance.now()}else if(state==='select'||state==='settings')menuShow()}if(e.key==='Enter'&&state==='menu')courseSelect();if(e.key.toLowerCase()==='g'){ghostVisible=!ghostVisible;localStorage.setItem('momentum-ghost-visible',ghostVisible?'1':'0');document.querySelector('#ghostStatus').textContent=ghostVisible?'GHOST ON':'GHOST OFF'}
if(e.key.toLowerCase()==='r'&&(state==='play'||state==='pause'||state==='finish'))start(level)});
addEventListener('keyup',e=>{keys[e.key]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')menuShow('pause')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')menuShow('pause')});
document.querySelectorAll('#mobile button').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;if(k===' ')player.buffer=9;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointercancel',()=>keys[k]=false)});
// Show a clear error screen if the canvas cannot initialize on an older browser.
 menuShow();requestAnimationFrame(loop);
})();
